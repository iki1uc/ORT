<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORT · PENTHOUSE · 360° · 12e · 6D · iki1uc</title>

<style>
/* ===== BASIS ===== */
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background: #0a0a0f;
  color: #00ffff;
  font-family: 'Consolas', 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  perspective: 1200px;
}

/* ===== HEADER ===== */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: rgba(10,10,18,0.92);
  border-bottom: 2px solid #33ccff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  z-index: 1000;
  backdrop-filter: blur(10px);
}
.header h1 {
  color: #33ccff;
  font-size: 20px;
  text-shadow: 0 0 30px rgba(51,204,255,0.3);
  letter-spacing: 3px;
}
.header h1 span { color: #ffdd00; }
.header .info {
  color: #6688aa;
  font-size: 11px;
  display: flex;
  gap: 24px;
}
.header .info span { color: #ffdd00; }
.header .info .freq { color: #ff66ff; }

/* ===== PENTHOUSE ===== */
#penthouse {
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  bottom: 60px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: radial-gradient(ellipse at center, #0a0a1a, #000000);
  overflow: hidden;
}

/* ===== 360° PANORAMA ===== */
.panorama {
  position: relative;
  width: 100%;
  max-width: 1200px;
  height: 100%;
  max-height: 700px;
  transform: rotateX(5deg) rotateY(0deg);
  transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}
.panorama:hover {
  transform: rotateX(2deg) rotateY(5deg);
}

/* ===== 6D-MATRIX BODEN ===== */
.floor {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) rotateX(90deg) translateZ(-200px);
  width: 800px;
  height: 800px;
  background: repeating-conic-gradient(
    from 0deg at 50% 50%,
    #1a1a3a 0deg 10deg,
    #0a0a1a 10deg 20deg
  );
  border-radius: 50%;
  opacity: 0.3;
  animation: floorSpin 40s linear infinite;
  box-shadow: 0 0 80px rgba(51,204,255,0.1);
}
@keyframes floorSpin {
  from { transform: translateX(-50%) rotateX(90deg) translateZ(-200px) rotate(0deg); }
  to { transform: translateX(-50%) rotateX(90deg) translateZ(-200px) rotate(360deg); }
}

/* ===== 12e FREQUENZ-STROM ===== */
.freq-stream {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  overflow: hidden;
}
.freq-particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #33ccff;
  border-radius: 50%;
  box-shadow: 0 0 20px rgba(51,204,255,0.5);
  animation: freqRise linear infinite;
}
@keyframes freqRise {
  0% { transform: translateY(100%) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-100%) scale(1); opacity: 0; }
}

/* ===== SCHACHBRETT-BODEN ===== */
.chess-floor {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) rotateX(70deg) translateZ(-100px);
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 2px;
  width: 360px;
  height: 360px;
  opacity: 0.4;
}
.chess-floor .cell {
  background: #1a1a2a;
  aspect-ratio: 1;
  border-radius: 2px;
}
.chess-floor .cell.light { background: #2a2a4a; }
.chess-floor .cell.dark { background: #0a0a1a; }
.chess-floor .cell.omega { background: #ffdd00; box-shadow: 0 0 20px rgba(255,221,0,0.2); }

/* ===== RESPO-ARG-SCANNER ===== */
.scanner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 400px;
  height: 400px;
  border: 2px solid rgba(51,204,255,0.15);
  border-radius: 50%;
  animation: scannerPulse 3s ease-in-out infinite;
}
.scanner::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  border: 1px solid rgba(255,221,0,0.1);
  border-radius: 50%;
  animation: scannerPulse 2s ease-in-out infinite 0.5s;
}
.scanner::after {
  content: '●';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ffdd00;
  font-size: 12px;
  animation: scannerBlink 1s ease-in-out infinite;
}
@keyframes scannerPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
  50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
}
@keyframes scannerBlink {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; text-shadow: 0 0 40px #ffdd00; }
}

/* ===== 6D-ACHSE ===== */
.axis-6d {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 600px;
  height: 600px;
  border: 1px solid rgba(51,204,255,0.05);
  border-radius: 50%;
  animation: axisSpin 60s linear infinite;
}
.axis-6d .ring {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(51,204,255,0.08);
}
.axis-6d .ring.r1 { width: 80%; height: 80%; }
.axis-6d .ring.r2 { width: 60%; height: 60%; }
.axis-6d .ring.r3 { width: 40%; height: 40%; }
.axis-6d .ring.r4 { width: 20%; height: 20%; border-color: rgba(255,221,0,0.15); }
@keyframes axisSpin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* ===== ORT-MARKER ===== */
.ort-marker {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ffdd00;
  font-size: 48px;
  text-shadow: 0 0 60px rgba(255,221,0,0.3);
  animation: markerPulse 2s ease-in-out infinite;
}
@keyframes markerPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
  50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
}

/* ===== .TMP-RÄUME ===== */
.tmp-rooms {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
}
.tmp-room {
  position: absolute;
  padding: 4px 10px;
  background: rgba(17,17,34,0.6);
  border: 1px solid rgba(51,204,255,0.1);
  border-radius: 4px;
  font-size: 8px;
  color: #6688aa;
  backdrop-filter: blur(4px);
  transition: all 0.3s;
  cursor: pointer;
  pointer-events: auto;
}
.tmp-room:hover {
  border-color: #33ccff;
  color: #00ffff;
  transform: scale(1.1);
  box-shadow: 0 0 30px rgba(51,204,255,0.1);
}

/* ===== STATUS ===== */
#status {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: rgba(10,10,18,0.92);
  border-top: 2px solid #2a2a3a;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 24px;
  z-index: 1000;
  backdrop-filter: blur(10px);
}
#status .left { color: #6688aa; font-size: 12px; }
#status .left span { color: #ffdd00; }
#status .center { color: #33ccff; font-size: 13px; }
#status .center span { color: #ff66ff; }
#status .right { color: #6688aa; font-size: 11px; }
#status .right span { color: #88ff44; }

/* ===== CONTROLS ===== */
#controls {
  position: fixed;
  bottom: 62px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 1001;
}
#controls button {
  background: rgba(17,17,34,0.8);
  color: #6688aa;
  border: 1px solid #2a2a4a;
  padding: 6px 16px;
  cursor: pointer;
  font-family: 'Consolas', monospace;
  font-size: 10px;
  border-radius: 4px;
  transition: all 0.3s;
  backdrop-filter: blur(4px);
}
#controls button:hover { background: #1a1a3a; border-color: #66ccff; color: #00ffff; }
#controls button.active { background: #1a2a4a; color: #00ff88; border-color: #00ff88; }
#controls button.penthouse { color: #ffdd00; border-color: #554400; }
#controls button.penthouse:hover { background: #2a1a00; border-color: #ffdd00; }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .header h1 { font-size: 14px; }
  .header .info { font-size: 9px; gap: 12px; }
  .floor { width: 500px; height: 500px; }
  .chess-floor { width: 240px; height: 240px; }
  .scanner { width: 280px; height: 280px; }
  .scanner::before { width: 140px; height: 140px; }
  .axis-6d { width: 400px; height: 400px; }
  .ort-marker { font-size: 32px; }
  .tmp-room { font-size: 6px; padding: 2px 6px; }
}
@media (max-width: 600px) {
  .header .info { display: none; }
  #controls { bottom: 62px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
  .floor { width: 300px; height: 300px; }
  .chess-floor { width: 160px; height: 160px; }
  .scanner { width: 200px; height: 200px; }
  .scanner::before { width: 100px; height: 100px; }
  .axis-6d { width: 280px; height: 280px; }
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <h1>🏠 ORT · <span>PENTHOUSE</span> · 360°</h1>
  <div class="info">
    <span class="freq">12e</span>
    <span>6D · <span id="d5">D5</span></span>
    <span>RESPO · <span id="respo-status">synthesis</span></span>
    <span>NC² · <span id="nc2-val">128</span></span>
  </div>
</div>

<!-- ===== PENTHOUSE ===== -->
<div id="penthouse">
  <div class="panorama" id="panorama">

    <!-- 6D-MATRIX BODEN -->
    <div class="floor"></div>

    <!-- 12e FREQUENZ-STROM -->
    <div class="freq-stream" id="freqStream"></div>

    <!-- SCHACHBRETT-BODEN -->
    <div class="chess-floor" id="chessFloor"></div>

    <!-- 6D-ACHSE -->
    <div class="axis-6d">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="ring r4"></div>
    </div>

    <!-- RESPO-ARG-SCANNER -->
    <div class="scanner"></div>

    <!-- ORT-MARKER -->
    <div class="ort-marker">◉</div>

    <!-- .TMP-RÄUME -->
    <div class="tmp-rooms" id="tmpRooms"></div>

  </div>
</div>

<!-- ===== CONTROLS ===== -->
<div id="controls">
  <button id="btnReset" class="penthouse">⟲ RESET</button>
  <button id="btnRotate" class="active">⟳ ROTATE</button>
  <button id="btnFreq">📡 FREQ</button>
  <button id="btnScan">🔍 SCAN</button>
  <button id="btnBoard">♟️ BOARD</button>
  <button id="btnPenthouse" class="penthouse active">🏠 PENTHOUSE</button>
</div>

<!-- ===== STATUS ===== -->
<div id="status">
  <div class="left">ORT · <span id="ort-state">aktiv</span></div>
  <div class="center">◉ <span id="center-info">RESPO.synthesis · GEO.TRANS</span></div>
  <div class="right">SCORE: <span id="score-val">0</span> · TMP: <span id="tmp-val">12e</span></div>
</div>

<!-- ============================================================ -->
<!-- SCRIPT – ORT PENTHOUSE ENGINE -->
<!-- ============================================================ -->
<script>
// ============================================================
// ORT · PENTHOUSE · 360° · 12e · 6D
// ============================================================

// ===== ORT KERNEL =====
const ORT = {
  id: "ORT",
  layer: "Q",
  type: "target",
  state: "active",
  freq: 12,
  seq: 360,
  d5: "ORT",
  vector: {
    NC2: 128,
    D6: 14,
    DYN: 9,
    ZEN: "stabil",
    SURE: 2,
    GEO: "TRANS",
    RESPO: "synthesis"
  },
  compat: ["ROOT", "ACHSE", "TMP", "LAGE", "laTER"]
};

// ===== .TMP RÄUME =====
const TMP_ROOMS = [
  { id: "bauer.tmp", x: 10, y: 15, label: "♟️" },
  { id: "dame.tmp", x: 75, y: 10, label: "♕" },
  { id: "pferd.tmp", x: 85, y: 45, label: "♘" },
  { id: "tetriz.tmp", x: 55, y: 80, label: "🧩" },
  { id: "operator.tmp", x: 20, y: 70, label: "⚙️" },
  { id: "octa.tmp", x: 65, y: 25, label: "◈" },
  { id: "xarg.tmp", x: 40, y: 40, label: "✖" },
  { id: "schachac.tmp", x: 30, y: 50, label: "♚" },
  { id: "arg.tmp", x: 50, y: 55, label: "⚡" },
  { id: "score.tmp", x: 70, y: 65, label: "📊" },
  { id: "error.tmp", x: 15, y: 35, label: "⚠️" },
  { id: "help.tmp", x: 45, y: 20, label: "❓" },
  { id: "morph.tmp", x: 80, y: 80, label: "🌀" },
  { id: "fit.tmp", x: 25, y: 25, label: "✅" },
  { id: "edit.tmp", x: 60, y: 50, label: "✏️" }
];

// ===== STATE =====
let state = {
  rotate: true,
  freq: 12,
  scan: false,
  board: false,
  score: 0,
  tmp: "12e",
  angle: 0
};

// ===== DOM REFS =====
const panorama = document.getElementById('panorama');
const freqStream = document.getElementById('freqStream');
const chessFloor = document.getElementById('chessFloor');
const tmpRooms = document.getElementById('tmpRooms');

// ===== BUILD CHESS FLOOR =====
function buildChessFloor() {
  chessFloor.innerHTML = '';
  const pieces = ['♖','♘','♗','♕','♔','♗','♘','♖','Ω'];
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      const isLight = (r + c) % 2 === 0;
      const isOmega = c === 8 || r === 8;
      cell.className = `cell ${isLight ? 'light' : 'dark'} ${isOmega ? 'omega' : ''}`;
      if (r === 0 && c < 8) cell.textContent = pieces[c];
      if (r === 8 && c < 8) cell.textContent = pieces[c].toLowerCase();
      if (c === 8 && r < 8) cell.textContent = 'Ω';
      if (r === 8 && c === 8) cell.textContent = '◉';
      cell.style.fontSize = '10px';
      cell.style.display = 'flex';
      cell.style.justifyContent = 'center';
      cell.style.alignItems = 'center';
      chessFloor.appendChild(cell);
    }
  }
}

// ===== BUILD .TMP RÄUME =====
function buildTmpRooms() {
  tmpRooms.innerHTML = '';
  TMP_ROOMS.forEach(room => {
    const el = document.createElement('div');
    el.className = 'tmp-room';
    el.style.left = room.x + '%';
    el.style.top = room.y + '%';
    el.textContent = room.label + ' ' + room.id;
    el.title = room.id;
    el.onclick = () => {
      state.score += 1;
      document.getElementById('score-val').textContent = state.score;
      el.style.borderColor = '#ffdd00';
      el.style.color = '#ffdd00';
      setTimeout(() => {
        el.style.borderColor = 'rgba(51,204,255,0.1)';
        el.style.color = '#6688aa';
      }, 500);
    };
    tmpRooms.appendChild(el);
  });
}

// ===== BUILD FREQ PARTICLES =====
function buildFreqParticles() {
  freqStream.innerHTML = '';
  const count = 30 + Math.floor(Math.random() * 20);
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'freq-particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.width = (2 + Math.random() * 4) + 'px';
    p.style.height = p.style.width;
    p.style.animationDuration = (3 + Math.random() * 4) + 's';
    p.style.animationDelay = (Math.random() * 4) + 's';
    p.style.background = ['#33ccff', '#ffdd00', '#ff66ff', '#88ff44'][Math.floor(Math.random() * 4)];
    p.style.boxShadow = `0 0 ${10 + Math.random() * 20}px ${p.style.background}`;
    freqStream.appendChild(p);
  }
}

// ===== ROTATE =====
let rotateInterval = null;

function startRotate() {
  if (rotateInterval) clearInterval(rotateInterval);
  let angle = 0;
  rotateInterval = setInterval(() => {
    if (state.rotate) {
      angle += 0.3;
      panorama.style.transform = `rotateX(5deg) rotateY(${angle}deg)`;
    }
  }, 50);
}

function toggleRotate() {
  state.rotate = !state.rotate;
  document.getElementById('btnRotate').classList.toggle('active');
  if (state.rotate) {
    document.getElementById('btnRotate').textContent = '⟳ ROTATE';
  } else {
    document.getElementById('btnRotate').textContent = '⏸ PAUSE';
  }
}

// ===== SCAN =====
function toggleScan() {
  state.scan = !state.scan;
  document.getElementById('btnScan').classList.toggle('active');
  const scanner = document.querySelector('.scanner');
  if (state.scan) {
    scanner.style.borderColor = 'rgba(255,221,0,0.5)';
    scanner.style.boxShadow = '0 0 60px rgba(255,221,0,0.1)';
    document.getElementById('btnScan').textContent = '🔍 SCAN·ON';
    document.getElementById('respo-status').textContent = 'scanning';
  } else {
    scanner.style.borderColor = 'rgba(51,204,255,0.15)';
    scanner.style.boxShadow = 'none';
    document.getElementById('btnScan').textContent = '🔍 SCAN';
    document.getElementById('respo-status').textContent = 'synthesis';
  }
}

// ===== FREQ =====
function toggleFreq() {
  state.freq = state.freq === 12 ? 24 : 12;
  document.getElementById('btnFreq').classList.toggle('active');
  document.getElementById('tmp-val').textContent = state.freq + 'e';
  document.querySelector('.freq').textContent = state.freq + 'e';
  buildFreqParticles();
}

// ===== BOARD =====
function toggleBoard() {
  state.board = !state.board;
  document.getElementById('btnBoard').classList.toggle('active');
  chessFloor.style.opacity = state.board ? '0.8' : '0.4';
  document.getElementById('btnBoard').textContent = state.board ? '♟️ BOARD·ON' : '♟️ BOARD';
}

// ===== RESET =====
function resetPenthouse() {
  state.score = 0;
  state.angle = 0;
  document.getElementById('score-val').textContent = '0';
  document.getElementById('ort-state').textContent = 'aktiv';
  document.getElementById('center-info').textContent = 'RESPO.synthesis · GEO.TRANS';
  panorama.style.transform = 'rotateX(5deg) rotateY(0deg)';
  // Reset .tmp rooms
  document.querySelectorAll('.tmp-room').forEach(el => {
    el.style.borderColor = 'rgba(51,204,255,0.1)';
    el.style.color = '#6688aa';
  });
}

// ===== PENTHOUSE BUTTON =====
function goPenthouse() {
  document.getElementById('btnPenthouse').classList.toggle('active');
  // Fancy effect
  document.querySelector('.ort-marker').style.animation = 'none';
  setTimeout(() => {
    document.querySelector('.ort-marker').style.animation = 'markerPulse 2s ease-in-out infinite';
  }, 10);
  document.getElementById('center-info').textContent = '🏠 PENTHOUSE · 360°';
}

// ===== SCORE UPDATE =====
function updateScore() {
  state.score += 0.1;
  document.getElementById('score-val').textContent = Math.floor(state.score);
  requestAnimationFrame(updateScore);
}

// ===== INIT =====
function init() {
  buildChessFloor();
  buildTmpRooms();
  buildFreqParticles();
  startRotate();

  // Controls
  document.getElementById('btnReset').addEventListener('click', resetPenthouse);
  document.getElementById('btnRotate').addEventListener('click', toggleRotate);
  document.getElementById('btnFreq').addEventListener('click', toggleFreq);
  document.getElementById('btnScan').addEventListener('click', toggleScan);
  document.getElementById('btnBoard').addEventListener('click', toggleBoard);
  document.getElementById('btnPenthouse').addEventListener('click', goPenthouse);

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') resetPenthouse();
    if (e.key === ' ') { e.preventDefault(); toggleRotate(); }
    if (e.key === 'f' || e.key === 'F') toggleFreq();
    if (e.key === 's' || e.key === 'S') toggleScan();
    if (e.key === 'b' || e.key === 'B') toggleBoard();
    if (e.key === 'p' || e.key === 'P') goPenthouse();
  });

  // Auto score
  updateScore();

  console.log('🏠 ORT PENTHOUSE geladen');
  console.log('📡 12e · 6D · 360° · RESPO.synthesis');
  console.log('♟️ SCHACH.tmp · .tmp-Räume · SCANNER');
  console.log('⌨️  r=Reset  Space=Rotate  f=Freq  s=Scan  b=Board  p=Penthouse');
}

// DOM Ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

</body>
</html>
