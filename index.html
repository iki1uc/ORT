<h2>Struktur‑Ordner (U → Q → T → H → B)</h2>

<div id="folders"></div>

<script>
const scanOrder = ["U", "Q", "T", "H", "B"];

async function scanFolder(folder) {
  try {
    const res = await fetch(folder + "/");
    if (!res.ok) return;

    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const links = [...doc.querySelectorAll("a")];

    const section = document.createElement("div");
    section.innerHTML = `<h2>${folder}</h2><ul></ul>`;
    const ul = section.querySelector("ul");

    links.forEach(link => {
      const name = link.textContent.trim();
      if (name !== "../") {
        const li = document.createElement("li");
        li.innerHTML = `<a href="${folder}/${link.getAttribute("href")}">${name}</a>`;
        ul.appendChild(li);
      }
    });

    document.getElementById("folders").appendChild(section);
  } catch (e) {}
}

scanOrder.forEach(scanFolder);
</script>

</body>
